server:
  port: 8888
spring:
  application:
    name: station-service

  # 1. Database Connection Settings
  datasource:
    url: jdbc:postgresql://localhost:5432/stationdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    generate-unique-name: false

  # 2. H2 Web Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # 3. Spring Data JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

