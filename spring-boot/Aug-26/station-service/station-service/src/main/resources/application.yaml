spring:
  application:
    name: station-service
  profiles:
    active: dev
  # 1. Database Connection Settings
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
    generate-unique-name: false

  # 2. H2 Web Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # 3. Spring Data JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


app:
  payment:
    gateway-url: https://payments.example.com
    timeout-seconds: 30
    retry-attempts: 3
  security:
    jwt-secret: ${JWT_SECRET}
    token-expiry-hours: 24
